<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>DeepSeek Harness</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07090f;
        --ink: #eef1f8;
        --muted: #8b93a7;
        --blue: #4d6bfe;
        --danger: #ff6b6b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(900px 520px at 50% 22%, rgba(255, 107, 107, 0.12), transparent 60%),
          var(--bg);
        color: var(--ink);
        font-family: "Inter", "Segoe UI", system-ui, -apple-system, "Noto Sans", sans-serif;
      }

      main {
        width: min(640px, calc(100vw - 64px));
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }

      .logo {
        width: 84px;
        height: 84px;
        border-radius: 20px;
        opacity: 0.55;
        filter: grayscale(0.35) drop-shadow(0 14px 30px rgba(0, 0, 0, 0.45));
      }

      h1 {
        margin: 4px 0 0;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: -0.015em;
      }

      p.message {
        margin: 0;
        font-size: 14px;
        color: var(--muted);
        max-width: 520px;
      }

      pre {
        width: 100%;
        max-height: 190px;
        overflow: auto;
        margin: 6px 0 0;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        background: rgba(255, 255, 255, 0.03);
        color: #9aa3b8;
        font-family: "JetBrains Mono", ui-monospace, "Fira Code", monospace;
        font-size: 11.5px;
        line-height: 1.55;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
      }

      pre:empty {
        display: none;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 8px;
        flex-wrap: wrap;
        justify-content: center;
      }

      button {
        font: inherit;
        font-size: 13.5px;
        font-weight: 550;
        padding: 9px 18px;
        border-radius: 10px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: background 0.15s ease, border-color 0.15s ease, transform 0.06s ease;
      }

      button:active {
        transform: translateY(1px);
      }

      button.primary {
        background: var(--blue);
        color: #fff;
      }

      button.primary:hover {
        background: #5d79ff;
      }

      button.ghost {
        background: transparent;
        border-color: rgba(255, 255, 255, 0.14);
        color: var(--ink);
      }

      button.ghost:hover {
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="assets/icon-512.png" alt="DeepSeek" />
      <h1 id="title">No se pudo iniciar DSH Desktop</h1>
      <p class="message" id="message">El servidor local no respondió.</p>
      <pre id="detail"></pre>
      <div class="actions">
        <button class="primary" id="retry">Reintentar</button>
        <button class="ghost" id="logs">Abrir registros</button>
        <button class="ghost" id="quit">Salir</button>
      </div>
    </main>

    <script>
      const messageEl = document.getElementById('message')
      const detailEl = document.getElementById('detail')

      function render(status) {
        if (!status) return
        if (status.message) messageEl.textContent = status.message
        detailEl.textContent = status.detail || ''
      }

      document.getElementById('retry').addEventListener('click', () => {
        messageEl.textContent = 'Reiniciando…'
        detailEl.textContent = ''
        if (window.dshDesktop) window.dshDesktop.retry()
      })
      document.getElementById('logs').addEventListener('click', () => {
        if (window.dshDesktop) window.dshDesktop.openLogs()
      })
      document.getElementById('quit').addEventListener('click', () => {
        if (window.dshDesktop) window.dshDesktop.quit()
        else window.close()
      })

      if (window.dshDesktop) {
        window.dshDesktop.getStatus().then(render).catch(() => {})
        window.dshDesktop.onStatus(render)
      }
    </script>
  </body>
</html>
